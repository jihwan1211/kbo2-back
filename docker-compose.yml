# docker-compose.yml
version: "3.8"
services:
  postgres:
    image: postgres:latest
    container_name: kbo_postgres
    environment:
      POSTGRES_USER: kbo_user
      POSTGRES_PASSWORD: kbo_password
      POSTGRES_DB: kbo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
